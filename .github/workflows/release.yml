# Push a tag like v2.39 (matching APP_VERSION in AC8_Asset_Extractor.py) to publish a release.
# The app's updater (Settings → APP → Check for updates) downloads the zip attached here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Check the code and the version
        run: |
          python3 -m py_compile *.py "AC8 Unpacker/ac8_unpack.py"
          v=$(python3 -c "import re; print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('AC8_Asset_Extractor.py', encoding='utf-8').read()).group(1))")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "APP_VERSION is $v but the tag is $GITHUB_REF_NAME"; exit 1; fi

      - name: Build the launcher
        working-directory: launcher
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui -s -w" -o "../AC8 Asset Extractor.exe" .

      - name: Bundle retoc and repak (trumank, MIT)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "AC8 Unpacker/tools"
          echo "{" > "AC8 Unpacker/tools/versions.json"
          sep=""
          for t in retoc repak; do
            tag=$(gh release view --repo "trumank/$t" --json tagName -q .tagName)
            gh release download "$tag" --repo "trumank/$t" --pattern "*x86_64-pc-windows-msvc.zip" --dir "/tmp/$t"
            unzip -o -j /tmp/$t/*.zip "*$t.exe" -d "AC8 Unpacker/tools"
            printf '%s "%s": "%s"\n' "$sep" "$t" "${tag#v}" >> "AC8 Unpacker/tools/versions.json"
            sep=","
          done
          echo "}" >> "AC8 Unpacker/tools/versions.json"
          cat "AC8 Unpacker/tools/versions.json"

      - name: Package
        run: |
          mkdir -p "/tmp/pkg/AC8 Asset Extractor"
          tar cf - --exclude=./.git --exclude=./.github --exclude=./.gitignore . | tar xf - -C "/tmp/pkg/AC8 Asset Extractor"
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/AC8_Asset_Extractor_${GITHUB_REF_NAME}.zip" "AC8 Asset Extractor")
          python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "AC8_Asset_Extractor_${GITHUB_REF_NAME}.zip" \
            --title "AC8 Asset Extractor $GITHUB_REF_NAME" --notes-file notes.md
