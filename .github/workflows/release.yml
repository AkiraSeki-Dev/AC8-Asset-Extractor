# Publishes a release whenever main has an APP_VERSION (in app/AC8_Asset_Extractor.py) that has no release yet:
# bump the version, push, and v<APP_VERSION> appears on the Releases page with AC8_Asset_Extractor_v<X.Y>.zip —
# the file the app's updater (Settings → APP → Check for updates) downloads. Can also be run by hand from the
# Actions tab (Release → Run workflow); a version that already has a release is skipped.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "app/AC8_Asset_Extractor.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import re; print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('app/AC8_Asset_Extractor.py', encoding='utf-8').read()).group(1))")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v already has a release — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Building release v$v"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the code
        if: steps.ver.outputs.skip == 'false'
        run: python3 -m py_compile app/*.py "AC8 Unpacker/ac8_unpack.py"

      - uses: actions/setup-go@v5
        if: steps.ver.outputs.skip == 'false'
        with:
          go-version: "1.22"
          cache: false  # the launcher has no dependencies

      - name: Build the launcher
        if: steps.ver.outputs.skip == 'false'
        working-directory: launcher
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui -s -w" -o "../AC8 Asset Extractor.exe" .

      - name: Bundle retoc and repak (trumank, MIT)
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "AC8 Unpacker/tools"
          echo "{" > "AC8 Unpacker/tools/versions.json"
          sep=""
          for t in retoc repak; do
            tag=$(gh release view --repo "trumank/$t" --json tagName -q .tagName)
            gh release download "$tag" --repo "trumank/$t" --pattern "*x86_64-pc-windows-msvc.zip" --dir "/tmp/$t"
            unzip -o -j /tmp/$t/*.zip "*$t.exe" -d "AC8 Unpacker/tools"
            printf '%s "%s": "%s"\n' "$sep" "$t" "${tag#v}" >> "AC8 Unpacker/tools/versions.json"
            sep=","
          done
          echo "}" >> "AC8 Unpacker/tools/versions.json"
          cat "AC8 Unpacker/tools/versions.json"

      - name: Package
        if: steps.ver.outputs.skip == 'false'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p "/tmp/pkg/AC8 Asset Extractor"
          # only what the app needs to run (plus the licence / notice files the bundled tools and font require);
          # the launcher's source and the READMEs stay in the repo
          tar cf - --exclude=./.git --exclude=./.github --exclude=./.gitignore --exclude=./launcher \
            --exclude=./README.md "--exclude=./AC8 Unpacker/README.md" --exclude=notes.md --exclude=__pycache__ . \
            | tar xf - -C "/tmp/pkg/AC8 Asset Extractor"
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/AC8_Asset_Extractor_${TAG}.zip" "AC8 Asset Extractor")
          python3 .github/scripts/release_notes.py "$TAG" > notes.md
          cat notes.md

      - name: Publish the release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" "AC8_Asset_Extractor_${TAG}.zip" \
            --title "AC8 Asset Extractor $TAG" --notes-file notes.md --target "$GITHUB_SHA"
