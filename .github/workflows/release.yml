# Publish a GitHub release tagged like v2.39 (matching APP_VERSION in AC8_Asset_Extractor.py), e.g.
#   gh release create v2.39 --target main --title "AC8 Asset Extractor v2.39" --notes "…"
# or run this workflow by hand (Actions → Release → Run workflow) with the tag. It builds the launcher, bundles
# retoc and repak, and attaches AC8_Asset_Extractor_vX.Y.zip to the release — the file the app's updater
# (Settings → APP → Check for updates) downloads.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.39"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Check the code and the version
        run: |
          python3 -m py_compile *.py "AC8 Unpacker/ac8_unpack.py"
          v=$(python3 -c "import re; print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('AC8_Asset_Extractor.py', encoding='utf-8').read()).group(1))")
          if [ "v$v" != "$TAG" ]; then echo "APP_VERSION is $v but the tag is $TAG"; exit 1; fi

      - name: Build the launcher
        working-directory: launcher
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui -s -w" -o "../AC8 Asset Extractor.exe" .

      - name: Bundle retoc and repak (trumank, MIT)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "AC8 Unpacker/tools"
          echo "{" > "AC8 Unpacker/tools/versions.json"
          sep=""
          for t in retoc repak; do
            tag=$(gh release view --repo "trumank/$t" --json tagName -q .tagName)
            gh release download "$tag" --repo "trumank/$t" --pattern "*x86_64-pc-windows-msvc.zip" --dir "/tmp/$t"
            unzip -o -j /tmp/$t/*.zip "*$t.exe" -d "AC8 Unpacker/tools"
            printf '%s "%s": "%s"\n' "$sep" "$t" "${tag#v}" >> "AC8 Unpacker/tools/versions.json"
            sep=","
          done
          echo "}" >> "AC8 Unpacker/tools/versions.json"
          cat "AC8 Unpacker/tools/versions.json"

      - name: Package
        run: |
          mkdir -p "/tmp/pkg/AC8 Asset Extractor"
          tar cf - --exclude=./.git --exclude=./.github --exclude=./.gitignore . | tar xf - -C "/tmp/pkg/AC8 Asset Extractor"
          (cd /tmp/pkg && zip -qr "$GITHUB_WORKSPACE/AC8_Asset_Extractor_${TAG}.zip" "AC8 Asset Extractor")
          python3 .github/scripts/release_notes.py "$TAG" > notes.md
          cat notes.md

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "AC8_Asset_Extractor_${TAG}.zip" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "AC8_Asset_Extractor_${TAG}.zip" \
              --title "AC8 Asset Extractor $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
